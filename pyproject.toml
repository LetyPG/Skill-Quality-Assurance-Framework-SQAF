[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqaf"
version = "1.0.0"
description = "Skill Quality Assessment Framework — CLI runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
interactive = [
    "pyfiglet>=0.8",
]
hooks = [
    # Language detection (offline, no API key required)
    "lingua-language-detector>=2.0",
    # MIME type validation (requires system libmagic — optional)
    # Install with: pip install python-magic
    # macOS: brew install libmagic
    # Linux: sudo apt-get install libmagic1
    "python-magic>=0.4",
]

[project.scripts]
sqaf = "sqaf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqaf*", "hooks*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "hooks/tests"]

[tool.ruff.lint]
ignore = ["E402"]
