name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package in editable mode with all optional dependencies
          pip install -e ".[dev,interactive,hooks]"

      - name: Lint with ruff
        run: |
          ruff check sqaf/ hooks/ tests/

      - name: Run Core Framework Tests
        run: |
          python -m pytest tests/ -v

      - name: Run Security & Performance Hook Tests
        run: |
          python -m pytest hooks/tests/ -v
